# ==============================================================================
# Tiny386 Windows 95 Configuration
# ==============================================================================
#
# ------------------------------------------------------------------------------
# 鼠标操作与交互指南 (Mouse Controls & Interaction Guide)
# ------------------------------------------------------------------------------
# 1. 鼠标捕获与释放 (Grab / Ungrab Cursor):
#    - 快捷键: Ctrl + ] (左 Ctrl + 右方括号 ])
#      在宿主机与虚拟机之间切换鼠标独占捕获。
#      * 捕获状态 (Grabbed): 宿主机鼠标指针隐藏，启用 SDL 相对移动模式 (Relative Mode)，
#        光标平滑无阻地同步给 Win95，光标不会移出模拟器窗口。
#      * 释放状态 (Ungrabbed): 恢复宿主机正常光标。
#    - 窗口失焦自动释放 (Auto Focus Release):
#      使用 Cmd + Tab 切换应用或点击其他窗口时，Tiny386 会自动释放鼠标指针，避免光标被困。
#      切回窗口后按下 Ctrl + ] 即可重新捕获。
#
# 2. 鼠标按键映射 (Mouse Buttons):
#    - 鼠标左键 (Left Button): 正常点击 / 框选 / 拖拽 (PS/2 Bit 0)。
#    - 鼠标右键 (Right Button): 打开快捷菜单 / 属性 (PS/2 Bit 1)。
#    - 鼠标中键 (Middle Button / Wheel Click): 滚轮下按对应三键中键 (PS/2 Bit 2)。
#
# 3. 滚轮滚动与 macOS 触控板平滑手势 (Wheel Scrolling & Precision Trackpad):
#    - 协议支持: 完整支持 Microsoft IntelliMouse (IMPS/2) 4 字节数据包协议 (Device ID: 0x03)。
#      已打通 SeaBIOS INT 15h AX=C205h (BH=04h) 扩展服务与 Z 轴数据流回传。
#    - 传统滚轮:
#      * 向上滚动: 发送 dz = -1 (向 Win95 向上滚动视图)。
#      * 向下滚动: 发送 dz = +1 (向 Win95 向下滚动视图)。
#    - macOS 触控板 / Magic Mouse 双指滑动:
#      支持 SDL preciseY 高精度浮点累加器，微小滑动量连续累加达到 1 格阈值即平滑触发，
#      在 macOS 上拥有丝滑不卡顿的双指滚动体验。
#
# 4. 其他常用快捷键:
#    - Ctrl + [ (左 Ctrl + 左方括号 [): 开启 / 关闭屏幕 OSD 监控面板 (IDE / 磁盘状态等)。
# ==============================================================================

[pc]
bios = firmware/seabios/bios.bin
vga_bios = firmware/seabios/vgabios_cirrus.bin
vga_card = cirrus
mem_size = 16M
vga_mem_size = 2M
#fda = firmware/disk01.img

hda = firmware/win95.img

cdb = firmware/Windows 95 C.iso
fill_cmos = 1
enable_serial = 1
boot = c

# IRQ the emulated NE2000 asserts; must match the value the Win95 NE2000
# driver in this image is bound to (Device Manager -> NE2000 -> Resources).
ne2000_irq = 3

[display]
width = 640
height = 480

[cpu]
gen = 4
fpu = 0
