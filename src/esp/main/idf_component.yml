## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  espressif/esp_lcd_st7701:
    version: ==2.0.2
    rules:
    - if: idf_version >= 5.5
  espressif/esp_lcd_touch_gt911: ^1
  espressif/esp_wifi_remote:
    version: '*'
    rules:
    - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: ==2.12.3
    rules:
    - if: "target in [esp32p4]"
  espressif/esp_codec_dev:
    version: ^1.3.4
    rules:
    - if: "target in [esp32p4]"
  usb_host_hid: "^1.0.1"
